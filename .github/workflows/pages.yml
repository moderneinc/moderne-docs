name: Deploy Moderne docs to Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update docs"]
    types:
      - completed
  push:
    branches:
      - main

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 is required by showLastUpdateTime. Do not add
      # filter: blob:none — future.v4 makes Docusaurus read dates with
      # `git log --name-status`, whose rename detection needs historical blobs,
      # so the build lazily refetches them from the promisor remote mid-build.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Saved here on main so that pr-validation.yml can restore it.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            !node_modules/.cache
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Lint markdown
        run: yarn lint:markdown

      - name: Cache build compilation artifacts
        uses: actions/cache@v6
        with:
          path: node_modules/.cache
          key: docusaurus-ssg-${{ runner.os }}-${{ hashFiles('yarn.lock', 'docusaurus.config.ts', 'src/theme/**') }}
          restore-keys: |
            docusaurus-ssg-${{ runner.os }}-

      - name: Build website
        run: |
          set -o pipefail
          yarn build 2>&1 | { grep --line-buffered -v "^Generated markdown file:" || true; }
        env:
          DOCUSAURUS_SSG_WORKER_THREAD_RECYCLER_MAX_MEMORY: "512000000"
          DOCUSAURUS_SSR_CONCURRENCY: "16"
          NODE_OPTIONS: "--max-old-space-size=4096 --max-semi-space-size=64"
          DOCUSAURUS_IGNORE_SSG_WARNINGS: true

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
