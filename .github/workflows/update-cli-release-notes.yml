name: Update CLI release notes

on:
  schedule:
    # Run every day at 6 AM Pacific (2 PM UTC)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  update-release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # moderne-cli's releases are private, so the release notes app needs to be installed on moderne-cli
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.PROPRIETARY_RELEASE_NOTES_APP_ID }}
          private-key: ${{ secrets.PROPRIETARY_RELEASE_NOTES_PRIVATE_KEY }}
          owner: moderneinc
          repositories: moderne-cli

      - name: Add new CLI releases
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG_GRADLE_PROJECT_codegenomeUsername: ${{ secrets.CODEGENOME_USERNAME }}
          ORG_GRADLE_PROJECT_codegenomePassword: ${{ secrets.CODEGENOME_TOKEN }}
        run: ./gradlew updateCliReleases

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: docs/releases/cli-releases.md
          commit-message: Add new CLI releases
          title: 'chore: Add new CLI releases'
          body: |
            Automated addition of the Moderne CLI releases published since the last update.

            This PR was automatically generated by the scheduled workflow.
          branch: update-cli-release-notes
          delete-branch: true
