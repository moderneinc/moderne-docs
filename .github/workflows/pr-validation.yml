name: PR validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-validation-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Restore only: a cache saved on a pull request ref cannot be read by any
      # other pull request, so writing here would just fill the quota. The entry
      # this restores is published by the lint job of pages-sharded.yml on main.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            !node_modules/.cache
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      - name: Check file types
        run: node .github/scripts/check-file-types.js
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}

      - name: Validate CSS variables
        run: yarn validate:css

      - name: Lint markdown
        run: yarn lint:markdown

      - name: TypeScript type check
        run: yarn typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            !node_modules/.cache
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node24-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

      # Separate namespace: this build sets SKIP_RECIPE_CATALOG.
      - name: Cache build compilation artifacts
        uses: actions/cache@v6
        with:
          path: node_modules/.cache
          key: docusaurus-pr-${{ runner.os }}-${{ hashFiles('yarn.lock', 'docusaurus.config.ts', 'src/theme/**') }}
          restore-keys: |
            docusaurus-pr-${{ runner.os }}-

      - name: Build site
        run: |
          set -o pipefail
          yarn build 2>&1 | { grep --line-buffered -v "^Generated markdown file:" || true; }
        env:
          DOCUSAURUS_SSG_WORKER_THREAD_COUNT: "2"
          SKIP_RECIPE_CATALOG: "1"
          CI_STRICT_LINKS: "1"
          DOCUSAURUS_SSG_WORKER_THREAD_RECYCLER_MAX_MEMORY: "512000000"
          DOCUSAURUS_SSR_CONCURRENCY: "16"
          NODE_OPTIONS: "--max-old-space-size=1536 --max-semi-space-size=64"
          DOCUSAURUS_IGNORE_SSG_WARNINGS: true
