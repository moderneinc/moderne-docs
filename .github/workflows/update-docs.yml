# Keep the latest versions page in sync with the latest OpenRewrite releases.
# The name is load-bearing: pages-sharded.yml deploys when a run of "Update docs" completes.
name: Update docs

on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *

concurrency:
  group: "update-docs"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    name: Update docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Update the latest versions page
        env:
          ORG_GRADLE_PROJECT_codegenomeUsername: ${{ secrets.CODEGENOME_USERNAME }}
          ORG_GRADLE_PROJECT_codegenomePassword: ${{ secrets.CODEGENOME_TOKEN }}
        run: ./gradlew updateLatestVersions

      # Push back to the ref the workflow ran on: main for the scheduled runs, or the
      # selected branch for a manual workflow_dispatch.
      - name: Commit and push
        run: |
          git add docs/user-documentation/recipes/lists/latest-versions-of-every-openrewrite-module.md src/plugins/latest-versions.js
          git diff --cached --quiet && exit 0
          git config user.email "team@moderne.io"
          git config user.name "team-moderne[bot]"
          git commit -m "[Auto] Update latest versions as of $(date +'%Y-%m-%dT%H%M')"
          git push origin "HEAD:${{ github.ref_name }}"
