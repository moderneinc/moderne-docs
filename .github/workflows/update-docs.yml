# Update the docs using the rewrite-recipe-markdown-generator
name: Update docs

on:
  workflow_dispatch:
    inputs:
      latest-versions-only:
        type: boolean
        description: Only update the latest versions of every OpenRewrite module
        default: true
  schedule:
    - cron: 0 0 * * *

concurrency:
  group: "update-docs"
  cancel-in-progress: true

jobs:
  build:
    name: Update docs
    runs-on: ubuntu-latest
    env:
      LATEST_VERSIONS_ONLY: ${{ github.event_name != 'workflow_dispatch' || inputs.latest-versions-only }}
      # The generator resolves org.openrewrite and io.moderne artifacts from the Code
      # Genome Project when these are set; without them it documents whatever stale
      # releases have made it to Maven Central.
      ORG_GRADLE_PROJECT_codegenomeUsername: ${{ secrets.CGP_ARTIFACTS_MAVEN_USERNAME }}
      ORG_GRADLE_PROJECT_codegenomePassword: ${{ secrets.CGP_ARTIFACTS_MAVEN_TOKEN }}
    timeout-minutes: 30
    steps:
      # Shared setup
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v6
        if: ${{ env.LATEST_VERSIONS_ONLY != 'true' }}
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        if: ${{ env.LATEST_VERSIONS_ONLY != 'true' }}
        with:
          dotnet-version: '9.0.x'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-go@v6
        if: ${{ env.LATEST_VERSIONS_ONLY != 'true' }}
        with:
          go-version: '1.25'        # recipes-go and rewrite-go both require go 1.25 (their go.mod)
      - name: Build the rewrite-go-rpc server
        if: ${{ env.LATEST_VERSIONS_ONLY != 'true' }}
        run: |
          # Pin GOROOT to the `go` setup-go put on PATH, so the RPC server isn't handed a GOROOT from
          # a different release than the `go` it builds with. Drop once openrewrite/rewrite#8337 is
          # released; it isn't in v8.88.4.
          echo "GOROOT=$(go env GOROOT)" >> "$GITHUB_ENV"

          # rewrite-go-rpc isn't published as a binary and the loader launches it from PATH, so build
          # it from source; `go install` names the binary after its package dir (`rpc`).
          go install github.com/openrewrite/rewrite/rewrite-go/cmd/rpc@latest
          ln -sf "$(go env GOPATH)/bin/rpc" "$(go env GOPATH)/bin/rewrite-go-rpc"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Run generator
      - uses: actions/checkout@v7
        with:
          repository: 'openrewrite/rewrite-recipe-markdown-generator'
          path: 'rewrite-recipe-markdown-generator'
      - name: Generate Markdown
        run: ./gradlew run -PlatestVersionsOnly=${{ env.LATEST_VERSIONS_ONLY }}
        working-directory: rewrite-recipe-markdown-generator

      # Checkout docs repository
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: 'moderne-docs'

      # Configure git user
      - name: configure-git-user
        working-directory: moderne-docs
        run: |
          git config user.email "team@moderne.io"
          git config user.name "team-moderne[bot]"

      # Conditionally replace latest versions only
      - name: Replace latest versions
        if: ${{ env.LATEST_VERSIONS_ONLY == 'true' }}
        working-directory: moderne-docs
        run: |
          cp ../rewrite-recipe-markdown-generator/build/moderne-docs/latest-versions-of-every-openrewrite-module.md docs/user-documentation/recipes/lists/
          cp ../rewrite-recipe-markdown-generator/build/moderne-docs/latest-versions.js src/plugins/
          git add docs/user-documentation/recipes/lists/latest-versions-of-every-openrewrite-module.md src/plugins/latest-versions.js

      # Full recipe update - replace recipes and all reference files
      - name: Replace recipes and reference files
        if: ${{ env.LATEST_VERSIONS_ONLY != 'true' }}
        working-directory: moderne-docs
        run: |
          # Replace recipe-catalog directory (contains all individual recipe markdown files)
          rm -rf docs/user-documentation/recipes/recipe-catalog/
          cp -r ../rewrite-recipe-markdown-generator/build/moderne-docs/recipe-catalog docs/user-documentation/recipes/recipe-catalog

          # Replace lists directory
          rm -rf docs/user-documentation/recipes/lists/
          mkdir -p docs/user-documentation/recipes/lists/
          cp ../rewrite-recipe-markdown-generator/build/moderne-docs/lists/* docs/user-documentation/recipes/lists/

          # Copy latest-versions files (these are at the top level of the build output)
          cp ../rewrite-recipe-markdown-generator/build/moderne-docs/latest-versions-of-every-openrewrite-module.md docs/user-documentation/recipes/lists/
          cp ../rewrite-recipe-markdown-generator/build/moderne-docs/latest-versions.js src/plugins/

          # Stage all changes
          git add docs/user-documentation/recipes/recipe-catalog docs/user-documentation/recipes/lists src/plugins/latest-versions.js

      # Lint generated markdown before committing
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: moderne-docs/yarn.lock
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        working-directory: moderne-docs
      - name: Lint generated markdown
        run: yarn lint:markdown:recipes
        working-directory: moderne-docs

      # Commit and push changes
      - name: Commit and push
        working-directory: moderne-docs
        run: |
          git diff --quiet HEAD || (git commit -m "[Auto] Update docs as of $(date +'%Y-%m-%dT%H%M')" && git push origin main)
